version: '3'

services:
  app:
    image: nicholaslimck/corrosion-analyser:dev
    ports:
      - '8050:8050'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/')"]
      interval: 30s
      timeout: 5s
      retries: 3
